name: space-station

# La liste des containers à manager
services:

  # Base de données MySQL
  mysql:
    image: mysql:8.4.13
    container_name: space-station-db

    environment:
      MYSQL_ROOT_USERNAME: root
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: space_station

    # Port où l'on pourra se connecter pour avoir la base MySQL
    ports:
      - 3306:3306

    #Le chemin du fichier à executer
    volumes:
      - space-station-data:/data/var/lib/mysql 

    networks:
      - space-station-network
    
  #Service pour accéder à la BDD via un localhost
  pma:
    image: phpmyadmin
    container_name: space-station-pma

    environment:
      PMA_HOST: mysql

    networks:
     - space-station-network
    
    depends_on:
      mysql:
        condition: service_healthy

  # Créer un service "springboot", qui deviendra un container Docker
  springboot:
    image: space-station:boot
    build: ../space-station-back
    container_name: space-station-back

    environment:
     - SPRING_DATASOURCE_URL=jdbc:mysql://space-station-db:3306/space_station
     - SPRING_DATASOURCE_USERNAME=root
     - SPRING_DATASOURCE_PASSWORD=root
     - JWT_SECRET_PATH=/secrets/jwt.key

    volumes:
     - ../secrets/jwt.key:/secrets/jwt.key

    ports:
     - 8080:8080

    networks:
      - space-station-network

    depends_on:
      mysql:
        condition: service_healthy
  

  # Créer un service "springboot", qui deviendra un container Docker
  angular:
    image: space-station:angular
    build: ../space-station-front
    container_name: space-station-front

    ports:
      - 4200:80

    networks:
      - space-station-network
    
    depends_on:
      - springboot

  # Serveur Jenkins
  # jenkins:
  #   image: jenkins/jenkins:lts-jdk21
  #   container_name: space-station-jenkins
  #   restart: unless-stopped

  #   ports:
  #     - 8081:8080

  #   volumes:
  #     - jenkins_data:/var/jenkins_home

  #   networks:
  #     - space-station-network


# Déclaration du réseau personnalisé
networks:
  space-station-network:
    name: space-station-network

# Déclaration du volume MySQL
volumes:
  space-station-data:
    name: space-station-data
  # jenkins_data:
