  # Créer un service "springboot", qui deviendra un container Docker
  springboot:
    image: space-station:boot
    build: ../space-station-back
    container_name: space-station-back

    extra_hosts:
    - "host.docker.internal:host-gateway"

    environment:
     - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3336/space_station?createDatabaseIfNotExist=TRUE
     - SPRING_DATASOURCE_USERNAME=root
     - SPRING_DATASOURCE_PASSWORD=HSTbigk5Og1ROqUJO+L+SrlzAyyTXJQ6
     - SPRING_JPA_HIBERNATE_DDL_AUTO=update
     - JWT_SECRET_PATH=/secrets/jwt.key

    volumes:
     - ../secrets/jwt.key:/secrets/jwt.key

    # ports:
    #  - 7002:8080 # Pas besoin d'être accessible en dehors du réseau Docker par les utilisateurs

    networks:
      - space-station-network

    # depends_on:
    #  - mysql


  # Créer un service "springboot", qui deviendra un container Docker
  angular:
    image: space-station:angular
    build: ../space-station-front
    container_name: space-station-front

    ports:
      - 4500:80

    networks:
      - space-station-network
    
    depends_on:
      - springboot

# Déclaration du réseau personnalisé
networks:
  space-station-network:
    name: space-station-network

# Déclaration du volume MySQL
volumes:
  space-station-data:
    name: space-station-data
