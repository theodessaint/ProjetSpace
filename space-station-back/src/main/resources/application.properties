spring.application.name=biblio-back

# Couleurs dans le terminal
spring.output.ansi.enabled= always

# Niveaux de journalisation
logging.level.station = DEBUG
logging.level.org.hibernate= INFO

# BDD
#spring.datasource.url = jdbc:mysql://localhost:3306/space_station
#spring.datasource.url = jdbc:mysql://localhost:8889/space_station
spring.datasource.username = root
spring.datasource.password = root

# JPA
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true

# JWT
jwt.secret.path=${JWT_SECRET_PATH:../secrets/jwt.key}