<div class="stars"></div>
<img #astronaute class="astronaute" id="astronaute" src="Assets/Images/Jastronaute.png" width="200">
<div class="twinkling"></div>
<header class="haut">
  <span class="haut-compte">Admin {{ username }} connecté</span>
  <a class="haut-lien" href="#" (click)="deconnexion($event)">Se déconnecter</a>
</header>

<main class="accueil">
  <h1 class="titre">Station<br>Spatiale</h1>
  <p class="accroche">Espace administrateur<br>gérez les règles et suivez les parties</p>

  <nav class="menu" aria-label="Menu administrateur">
    <button class="btn btn-principal" (click)="modifierRegles()">Modifier les règles</button>
    <button class="btn" (click)="partiesEnCours()">Parties en cours</button>
    <button class="btn" (click)="partiesTerminees()">Parties terminées</button>
  </nav>
</main>
