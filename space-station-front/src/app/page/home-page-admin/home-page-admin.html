<div class="admin">

  <!-- Titre principal -->
  <header class="entete">
    <h1>Administration - Station spatiale</h1>
  </header>

  <main class="contenu">

    <!-- Colonne gauche : statistiques -->
    <aside class="admin-stats">

      <!--Total des nombres de parties en cours et finies--->
      <div class="stat-item">
        <h2>Total nombre de parties</h2>
        <p>{{ nombreParties }}</p>
      </div>

      <div class="stat-item">
        <h2>En cours</h2>
        <p>{{ partiesEnCours }}</p>
      </div>

      <div class="stat-item">
        <h2>Finies</h2>
        <p>{{ partiesTerminees }}</p>
      </div>

    </aside>

    <!-- Partie centrale : liste des parties et comptes -->
    <section class="admin-liste">
      <h2>Liste partie / compte</h2>
      <div class="list-content"></div>
    </section>

    <!-- Colonne droite -->
    <aside class="admin-action">

      <!-- Gestion des comptes -->
      <section class="compte-gestion">

        <button class="admin-button">
          <span>Modifier / Supprimer compte</span>
        </button>

      </section>

      <!-- Conseil intergalactique -->
      <section class="conseil">

        <h2>Conseil intergalactique</h2>

        <div class="conseil-membres">

          <div class="conseil-membre">
            <img src="assets/images/admin/avatar1.png"
                 alt="Membre du conseil 1">
          </div>

          <div class="conseil-membre">
            <img src="assets/images/admin/avatar2.png"
                 alt="Membre du conseil 2">
          </div>

          <div class="conseil-membre">
            <img src="assets/images/admin/avatar3.png"
                 alt="Membre du conseil 3">
          </div>

          <div class="conseil-membre">
            <img src="assets/images/admin/avatar4.png"
                 alt="Membre du conseil 4">
          </div>

          <div class="conseil-membre">
            <img src="assets/images/admin/avatar5.png"
                 alt="Membre du conseil 5">
          </div>
          
        </div>
      </section>
    </aside>
  </main>
</div>
